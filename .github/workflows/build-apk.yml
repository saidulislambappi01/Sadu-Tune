
name: Build SADU TUNE APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Project
        run: unzip SADU_TUNE_Project.zip -d extracted

      - name: Build APK
        run: gradle -p extracted/SADU-TUNE assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADU-TUNE-APK
          path: extracted/SADU-TUNE/app/build/outputs/apk/debug/app-debug.apk

